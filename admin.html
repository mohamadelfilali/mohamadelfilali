<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم — محمد الفيلالي</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* أنماط إضافية خاصة بلوحة التحكم */
        .admin-login-wrapper {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .admin-card {
            width: min(100%, 480px);
            background: var(--panel);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-md);
            padding: 32px;
            box-shadow: var(--shadow);
        }
        .admin-dashboard {
            padding-block: 40px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--line);
        }
        .admin-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        .tab-btn {
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line);
            color: var(--text-soft);
            cursor: pointer;
            font-weight: 600;
        }
        .tab-btn.active {
            background: var(--accent);
            color: var(--accent-dark);
            border-color: var(--accent);
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .data-table th, .data-table td {
            padding: 14px;
            border-bottom: 1px solid var(--line);
            text-align: right;
            font-size: 0.85rem;
        }
        .data-table th {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.02);
        }
        .action-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-danger {
            background: rgba(255, 116, 116, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 116, 116, 0.3);
        }
        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- =========================================
         LOGIN SECTION
    ========================================== -->
    <div id="login-section" class="admin-login-wrapper">
        <div class="admin-card">
            <h2 style="margin-bottom: 8px;">تسجيل الدخول</h2>
            <p style="color: var(--text-soft); font-size: 0.85rem; margin-bottom: 24px;">لوحة إدارة موقع محمد الفيلالي</p>
            
            <form id="admin-login-form" class="form-field" style="gap: 16px;">
                <div>
                    <label for="admin-email">البريد الإلكتروني</label>
                    <input type="email" id="admin-email" required placeholder="admin@example.com">
                </div>
                <div>
                    <label for="admin-password">كلمة السر</label>
                    <input type="password" id="admin-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="button button-primary" style="margin-top: 10px;">دخول</button>
                <div id="login-status" class="form-status" style="margin-top: 10px;"></div>
            </form>
        </div>
    </div>

    <!-- =========================================
         DASHBOARD SECTION
    ========================================== -->
    <div id="dashboard-section" class="container admin-dashboard" hidden>
        
        <header class="admin-header">
            <div>
                <h1>لوحة التحكم</h1>
                <p style="color: var(--text-soft); font-size: 0.85rem;">مرحباً بك، يمكنك إدارة الرسائل والمشاريع من هنا.</p>
            </div>
            <button id="logout-btn" class="button button-secondary">تسجيل الخروج</button>
        </header>

        <!-- TABS -->
        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="messages-tab">الرسائل الواردة</button>
            <button class="tab-btn" data-tab="projects-tab">إدارة المشاريع</button>
        </div>

        <!-- MESSAGES TAB -->
        <div id="messages-tab" class="tab-content">
            <h3>الرسائل والطلبات</h3>
            <div id="messages-list-container" style="margin-top: 20px; overflow-x: auto;">
                <p style="color: var(--text-muted);">جاري تحميل الرسائل...</p>
            </div>
        </div>

        <!-- PROJECTS TAB -->
        <div id="projects-tab" class="tab-content" hidden>
            <h3>إضافة مشروع جديد</h3>
            <form id="add-project-form" class="contact-form" style="margin-block: 20px;">
                <div class="form-field">
                    <label for="project-title">عنوان المشروع</label>
                    <input type="text" id="project-title" required placeholder="مثال: متجر متكامل">
                </div>
                <div class="form-field">
                    <label for="project-description">وصف المشروع</label>
                    <textarea id="project-description" rows="3" required placeholder="وصف قصير عن المشروع..."></textarea>
                </div>
                <div class="form-field">
                    <label for="project-image">رابط صورة المشروع (URL)</label>
                    <input type="url" id="project-image" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-field">
                    <label for="project-url">رابط معاينة المشروع (URL)</label>
                    <input type="url" id="project-url" placeholder="https://example.com">
                </div>
                <button type="submit" class="button button-primary">حفظ وإضافة المشروع</button>
                <div id="project-status" class="form-status"></div>
            </form>

            <h3 style="margin-top: 40px;">المشاريع الحالية</h3>
            <div id="admin-projects-list" style="margin-top: 20px; overflow-x: auto;">
                <p style="color: var(--text-muted);">جاري تحميل المشاريع...</p>
            </div>
        </div>

    </div>

    <script src="js/admin.js"></script>
</body>
</html>
