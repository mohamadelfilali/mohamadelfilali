<!-- مكتبات Firebase SDK المتوافقة مع المتصفح -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
  // بيانات مشروعك الفعلي من Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAmKRshA0eez-LDOPfd3gMErM4PHSbavvI",
    authDomain: "mohamadelfilali.firebaseapp.com",
    projectId: "mohamadelfilali",
    storageBucket: "mohamadelfilali.firebasestorage.app",
    messagingSenderId: "940757659354",
    appId: "1:940757659354:web:304d393c03d64617bfffe3",
    measurementId: "G-P5X5THHLEX"
  };

  // ضع هنا بريدك الإلكتروني كمالك للموقع
  const OWNER_EMAIL = "rorminato@gmail.com"; 

  // تهيئة Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const provider = new firebase.auth.GoogleAuthProvider();

  // العناصر من الصفحة
  const loginBtn = document.getElementById('login-btn');
  const userSection = document.getElementById('user-section');
  const userPhoto = document.getElementById('user-photo');
  const dashboardBtn = document.getElementById('dashboard-btn');
  const logoutBtn = document.getElementById('logout-btn');

  // تسجيل الدخول بالحساب
  loginBtn.addEventListener('click', () => {
    auth.signInWithPopup(provider).catch(err => {
      console.error(err);
      alert("حدث خطأ أثناء تسجيل الدخول: " + err.message);
    });
  });

  // تسجيل الخروج
  logoutBtn.addEventListener('click', () => auth.signOut());

  // التوجيه لصفحة لوحة التحكم
  dashboardBtn.addEventListener('click', () => {
    window.location.href = 'dashboard.html';
  });

  // التحقق المباشر من حالة المستخدم
  auth.onAuthStateChanged(user => {
    if (user) {
      loginBtn.classList.add('hidden');
      userSection.classList.remove('hidden');
      userPhoto.src = user.photoURL || 'https://via.placeholder.com/36';

      // إظهار زر الداشبورد فقط إذا كان البريد يطابق بريد المالك
      if (user.email === OWNER_EMAIL) {
        dashboardBtn.classList.remove('hidden');
      } else {
        dashboardBtn.classList.add('hidden');
      }
    } else {
      loginBtn.classList.remove('hidden');
      userSection.classList.add('hidden');
    }
  });
</script>
