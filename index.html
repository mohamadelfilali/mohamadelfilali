<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed El Filali | البوابة الرسمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #151c2c;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-title: #ffffff;
            --text-body: #94a3b8;
            --border: #1e293b;
            --glass-bg: rgba(21, 28, 44, 0.75);
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-title);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 40%);
        }

        /* شاشة الأنيميشن */
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.5s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loader-screen p {
            margin-top: 1rem;
            color: var(--text-body);
            font-size: 0.95rem;
        }

        /* بوابة الدخول الإجبارية */
        #auth-portal-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 3rem 2rem;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-card h1 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: var(--text-body);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* محتوى الصفحة الرئيسية */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: #dc2626;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }

        .container {
            max-width: 650px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-body);
            font-size: 0.875rem;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            background-color: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: #ffffff;
            font-size: 0.95rem;
        }

        input:disabled {
            background-color: rgba(30, 41, 59, 0.4);
            color: #64748b;
            cursor: not-allowed;
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        .preview-badge {
            background: #f59e0b;
            color: #000;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            font-weight: 700;
            margin-right: 0.5rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة الأنيميشن للفحص المباشر -->
    <div id="loader-screen">
        <div class="spinner"></div>
        <p>جاري فحص الجلسة...</p>
    </div>

    <!-- 2. شاشة الدخول الإجبارية للزوار غير المسجلين -->
    <div id="auth-portal-screen" class="hidden">
        <div class="login-card">
            <h1>Mohammed El Filali</h1>
            <p>يرجى تسجيل الدخول بحساب Google للوصول إلى المنصة والخدمات.</p>
            <button id="portal-login-btn" class="btn" style="width: 100%;">
                تسجيل الدخول باستخدام Google
            </button>
        </div>
    </div>

    <!-- 3. الصفحة الرئيسية المحمية -->
    <div id="main-content" class="hidden">
        <header>
            <div class="brand-logo">
                Mohammed El Filali
                <span id="preview-tag" class="preview-badge hidden">وضع المعاينة</span>
            </div>
            <button id="logout-btn" class="btn btn-danger">تسجيل الخروج</button>
        </header>

        <div class="container">
            <div class="card">
                <h2 style="margin-bottom: 0.5rem;">إرسال طلب / تواصل مع الإدارة</h2>
                <p style="color: var(--text-body); margin-bottom: 2rem;">قم بإرسال رسالتك وسأقوم بالرد عليك في أسرع وقت.</p>

                <form id="support-form">
                    <div class="form-group">
                        <label>الاسم الكامل</label>
                        <input type="text" id="user-name" disabled>
                    </div>
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="user-email" disabled>
                    </div>
                    <div class="form-group">
                        <label>نص الرسالة / الطلب</label>
                        <textarea id="user-message" placeholder="اكتب تفاصيل طلبك هنا..." required></textarea>
                    </div>
                    <button type="submit" id="submit-btn" class="btn" style="width: 100%;">إرسال الطلب</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "mohamadelfilali",
            authDomain: "mohamadelfilali.firebaseapp.com",
            storageBucket: "mohamadelfilali.appspot.com"
        };

        const ADMIN_EMAIL = "rorminato@gmail.com";

        // عناصر الواجهة
        const loaderScreen = document.getElementById('loader-screen');
        const authPortalScreen = document.getElementById('auth-portal-screen');
        const mainContent = document.getElementById('main-content');
        const portalLoginBtn = document.getElementById('portal-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const supportForm = document.getElementById('support-form');
        const userNameInput = document.getElementById('user-name');
        const userEmailInput = document.getElementById('user-email');
        const userMessageInput = document.getElementById('user-message');
        const submitBtn = document.getElementById('submit-btn');
        const previewTag = document.getElementById('preview-tag');

        // كود آمن لإخفاء شاشة التحميل مهما حدث
        function hideLoader() {
            loaderScreen.style.opacity = '0';
            setTimeout(() => {
                loaderScreen.classList.add('hidden');
            }, 300);
        }

        // إخفاء الـ Loader تلقائياً بعد 500ms كحد أقصى تجنباً للتعليق
        let loaderHidden = false;
        const safetyTimer = setTimeout(() => {
            if (!loaderHidden) {
                loaderHidden = true;
                hideLoader();
                // إذا لم يستجب Firebase، اعرض شاشة الدخول تلقائياً
                if (mainContent.classList.contains('hidden')) {
                    authPortalScreen.classList.remove('hidden');
                }
            }
        }, 600);

        // فحص رمز المعاينة
        const urlParams = new URLSearchParams(window.location.search);
        const isPreviewMode = urlParams.get('mode') === 'preview';

        let app, auth, db, provider;
        let currentUser = null;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            provider = new GoogleAuthProvider();

            onAuthStateChanged(auth, (user) => {
                currentUser = user;

                if (!loaderHidden) {
                    loaderHidden = true;
                    hideLoader();
                }

                if (!user) {
                    mainContent.classList.add('hidden');
                    authPortalScreen.classList.remove('hidden');
                } else {
                    authPortalScreen.classList.add('hidden');

                    if (user.email === ADMIN_EMAIL && !isPreviewMode) {
                        window.location.href = "dashboard.html";
                        return;
                    }

                    if (user.email === ADMIN_EMAIL && isPreviewMode) {
                        previewTag.classList.remove('hidden');
                    }

                    mainContent.classList.remove('hidden');
                    userNameInput.value = user.displayName || "مستخدم";
                    userEmailInput.value = user.email;
                }
            });
        } catch (e) {
            console.error("Firebase init error:", e);
            hideLoader();
            authPortalScreen.classList.remove('hidden');
        }

        // تسجيل الدخول
        portalLoginBtn.addEventListener('click', () => {
            if (!auth) return alert("Firebase لم يتم تهيئته بمفتاح صحيح بعد.");
            signInWithPopup(auth, provider).catch((err) => {
                alert("خطأ في تسجيل الدخول: " + err.message);
            });
        });

        // تسجيل الخروج
        logoutBtn.addEventListener('click', () => {
            if (auth) signOut(auth);
        });

        // إرسال الطلب
        supportForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = userMessageInput.value.trim();
            if (!messageText) return;

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الإرسال...";

            try {
                await addDoc(collection(db, "messages"), {
                    senderName: currentUser.displayName,
                    senderEmail: currentUser.email,
                    message: messageText,
                    createdAt: serverTimestamp()
                });

                alert("تم إرسال طلبك بنجاح!");
                userMessageInput.value = "";
            } catch (error) {
                alert("حدث خطأ أثناء الإرسال: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "إرسال الطلب";
            }
        });
    </script>
</body>
</html>
