<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed El Filali | المنصة الرسمية</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #475569;
            color: var(--text-main);
        }

        .main-container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 0 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 0.75rem;
            border: 1px solid #334155;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.375rem;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:disabled {
            background-color: #1e293b;
            color: #64748b;
            cursor: not-allowed;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .notice-box {
            background-color: #334155;
            padding: 1rem;
            border-radius: 0.375rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Mohammed El Filali</div>
        <div class="nav-actions">
            <!-- زر لوحة التحكم للمسؤول فقط -->
            <a href="dashboard.html" id="admin-btn" class="btn btn-outline hidden">لوحة التحكم</a>
            <!-- زر تسجيل الدخول والخروج -->
            <button id="auth-btn" class="btn">تسجيل الدخول بـ Google</button>
        </div>
    </header>

    <div class="main-container">
        <div class="card">
            <h2>إرسال طلب / تواصل مع الإدارة</h2>

            <!-- تنبيه يظهر في حال عدم تسجيل الدخول -->
            <div id="login-notice" class="notice-box">
                يرجى تسجيل الدخول أولاً لتتمكن من إرسال الرسائل.
            </div>

            <!-- نموذج التواصل -->
            <form id="support-form" class="hidden">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="user-name" disabled>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="user-email" disabled>
                </div>
                <div class="form-group">
                    <label>رسالتك / طلبك</label>
                    <textarea id="user-message" placeholder="اكتب طلبك أو استفسارك هنا..." required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">إرسال الطلب</button>
            </form>
        </div>
    </div>

    <!-- SDK الخاص بـ Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروع Firebase الخاص بك
        const firebaseConfig = {
            apiKey: "AIzaSyD-EXAMPLE_KEY", // استبدل بـ apiKey الخاص بك من إعدادات المشروع
            authDomain: "mohamadelfilali.firebaseapp.com",
            projectId: "mohamadelfilali",
            storageBucket: "mohamadelfilali.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // البريد المعتمد كمسؤول
        const ADMIN_EMAIL = "rorminato@gmail.com";

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // عناصر الواجهة
        const authBtn = document.getElementById('auth-btn');
        const adminBtn = document.getElementById('admin-btn');
        const loginNotice = document.getElementById('login-notice');
        const supportForm = document.getElementById('support-form');
        const userNameInput = document.getElementById('user-name');
        const userEmailInput = document.getElementById('user-email');
        const userMessageInput = document.getElementById('user-message');

        let currentUser = null;

        // مراقبة حالة التسجيل
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                authBtn.textContent = "تسجيل الخروج";
                loginNotice.classList.add('hidden');
                supportForm.classList.remove('hidden');

                // تعبئة البيانات وقفلاها لحماية الهوية
                userNameInput.value = user.displayName || "مستخدم";
                userEmailInput.value = user.email;

                // إظهار زر الداشبورد للمسؤول فقط
                if (user.email === ADMIN_EMAIL) {
                    adminBtn.classList.remove('hidden');
                } else {
                    adminBtn.classList.add('hidden');
                }
            } else {
                authBtn.textContent = "تسجيل الدخول بـ Google";
                loginNotice.classList.remove('hidden');
                supportForm.classList.add('hidden');
                adminBtn.classList.add('hidden');
            }
        });

        // زر تسجيل الدخول/الخروج
        authBtn.addEventListener('click', () => {
            if (currentUser) {
                signOut(auth);
            } else {
                signInWithPopup(auth, provider).catch((error) => {
                    alert("حدث خطأ أثناء تسجيل الدخول: " + error.message);
                });
            }
        });

        // إرسال البيانات إلى Firestore
        supportForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = userMessageInput.value.trim();

            if (!messageText) return;

            try {
                await addDoc(collection(db, "messages"), {
                    senderName: currentUser.displayName,
                    senderEmail: currentUser.email,
                    message: messageText,
                    createdAt: serverTimestamp()
                });

                alert("تم إرسال طلبك بنجاح!");
                userMessageInput.value = "";
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.");
            }
        });
    </script>
</body>
</html>
