<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة الرئيسية</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --accent: #4facfe;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 8%;
      border-bottom: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.7);
    }
    .btn {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    
    /* شاشة تسجيل الدخول الإجبارية */
    .gate-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* محتوى الصفحة بعد الدخول */
    .main-content {
      max-width: 600px;
      margin: 3rem auto;
      padding: 2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 90%;
    }
    .form-group { margin-bottom: 1.2rem; text-align: right; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--muted); }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #000;
      color: #fff;
      font-family: inherit;
    }
    .form-group input[readonly] {
      background: #1f2937;
      color: #9ca3af;
      cursor: not-allowed;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div>الموقع الرسمي</div>
    <div id="user-profile" class="hidden" style="display: flex; gap: 10px; align-items: center;">
      <span id="user-display-name"></span>
      <a id="dashboard-btn" href="dashboard.html" class="btn hidden">لوحة التحكم ⚙️</a>
      <button id="logout-btn" class="btn btn-outline">تسجيل الخروج</button>
    </div>
  </header>

  <!-- شاشة الدخول الإجبارية (تظهر إذا لم يسجل دخوله) -->
  <div id="login-gate" class="gate-container">
    <h2>يرجى تسجيل الدخول للوصول إلى الصفحة الرئيسية</h2>
    <br>
    <button id="login-btn" class="btn">تسجيل الدخول عبر Google</button>
  </div>

  <!-- المحتوى الرئيسي (مخفي حتى يتم تسجيل الدخول) -->
  <main id="app-content" class="main-content hidden">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">التواصل مع فريق الدعم</h2>
    
    <form id="support-form">
      <div class="form-group">
        <label>الاسم الكامل:</label>
        <input type="text" id="sender-name" readonly>
      </div>
      
      <div class="form-group">
        <label>البريد الإلكتروني (غير قابل للتعديل):</label>
        <input type="email" id="sender-email" readonly>
      </div>

      <div class="form-group">
        <label>الرسالة:</label>
        <textarea id="sender-message" rows="5" placeholder="اكتب رسالتك هنا..." required></textarea>
      </div>

      <button type="submit" class="btn" style="width: 100%;">إرسال الرسالة</button>
    </form>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAmKRshA0eez-LDOPfd3gMErM4PHSbavvI",
      authDomain: "mohamadelfilali.firebaseapp.com",
      projectId: "mohamadelfilali",
      storageBucket: "mohamadelfilali.firebasestorage.app",
      messagingSenderId: "940757659354",
      appId: "1:940757659354:web:304d393c03d64617bfffe3",
      measurementId: "G-P5X5THHLEX"
    };

    // حساب المالك الخاص بك
    const OWNER_EMAIL = "rorminato@gmail.com"; 

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const loginGate = document.getElementById('login-gate');
    const appContent = document.getElementById('app-content');
    const userProfile = document.getElementById('user-profile');
    const dashboardBtn = document.getElementById('dashboard-btn');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');

    const senderName = document.getElementById('sender-name');
    const senderEmail = document.getElementById('sender-email');
    const supportForm = document.getElementById('support-form');

    loginBtn.addEventListener('click', () => {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    });

    logoutBtn.addEventListener('click', () => auth.signOut());

    // التحقق الإجباري من تسجيل الدخول
    auth.onAuthStateChanged(user => {
      if (user) {
        // المستخدم مسجل الدخول -> إظهار الصفحة وقفل بياناته
        loginGate.classList.add('hidden');
        appContent.classList.remove('hidden');
        userProfile.classList.remove('hidden');

        senderName.value = user.displayName || "مستخدم";
        senderEmail.value = user.email; // الإيميل من فايربيس تلقائياً

        // إذا كان المالك، يظهر زر الداشبورد
        if (user.email === OWNER_EMAIL) {
          dashboardBtn.classList.remove('hidden');
        } else {
          dashboardBtn.classList.add('hidden');
        }
      } else {
        // غير مسجل -> إخفاء الصفحة تماماً
        loginGate.classList.remove('hidden');
        appContent.classList.add('hidden');
        userProfile.classList.add('hidden');
      }
    });

    // إرسال الرسالة إلى قاعدة البيانات (Firestore)
    supportForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const messageText = document.getElementById('sender-message').value;

      db.collection('messages').add({
        name: senderName.value,
        email: senderEmail.value,
        message: messageText,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("تم إرسال رسالتك بنجاح!");
        document.getElementById('sender-message').value = "";
      }).catch(err => {
        alert("حدث خطأ أثناء الإرسال: " + err.message);
      });
    });
  </script>
</body>
</html>
