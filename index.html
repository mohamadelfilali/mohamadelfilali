<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed El Filali | المنصة الرسمية</title>
    <!-- خط تجريدي حديث من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #151c2c;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-title: #ffffff;
            --text-body: #94a3b8;
            --border: #1e293b;
            --glass-bg: rgba(21, 28, 44, 0.75);
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-title);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 40%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 3rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 0.65rem 1.4rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-title);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        .container {
            max-width: 650px;
            margin: 4rem auto;
            padding: 0 1.5rem;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .card-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .card-header p {
            color: var(--text-body);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-body);
            font-size: 0.875rem;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            background-color: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: #ffffff;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        input:disabled {
            background-color: rgba(30, 41, 59, 0.4);
            color: #64748b;
            cursor: not-allowed;
        }

        textarea {
            resize: vertical;
            min-height: 140px;
        }

        .auth-banner {
            background: rgba(30, 41, 59, 0.5);
            border: 1px dashed var(--border);
            padding: 2rem;
            border-radius: 0.75rem;
            text-align: center;
        }

        .auth-banner p {
            color: var(--text-body);
            margin-bottom: 1.25rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">Mohammed El Filali</div>
        <div class="nav-actions">
            <a href="dashboard.html" id="admin-btn" class="btn btn-secondary hidden">لوحة التحكم</a>
            <button id="auth-btn" class="btn">تسجيل الدخول بـ Google</button>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>بوابة الدعم والإدارة</h1>
                <p>قم بإرسال استفسارك أو طلبك المباشر وسأقوم بالرد عليك في أسرع وقت ممكن.</p>
            </div>

            <!-- مربع المطالبة بتسجيل الدخول -->
            <div id="login-notice" class="auth-banner">
                <p>يجب تسجيل الدخول باستخدام حساب Google المعتمد لتتمكن من رفع طلبك.</p>
                <button id="banner-auth-btn" class="btn">تسجيل الدخول الآن</button>
            </div>

            <!-- نموذج التواصل -->
            <form id="support-form" class="hidden">
                <div class="form-group">
                    <label>الاسم</label>
                    <input type="text" id="user-name" disabled>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="user-email" disabled>
                </div>
                <div class="form-group">
                    <label>تفاصيل الطلب / الرسالة</label>
                    <textarea id="user-message" placeholder="اكتب نص رسالتك بالتفصيل هنا..." required></textarea>
                </div>
                <button type="submit" id="submit-btn" class="btn" style="width: 100%;">إرسال الطلب</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK v10 (ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بمشروع mohamadelfilali
        const firebaseConfig = {
            projectId: "mohamadelfilali",
            authDomain: "mohamadelfilali.firebaseapp.com",
            storageBucket: "mohamadelfilali.appspot.com"
        };

        const ADMIN_EMAIL = "rorminato@gmail.com";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // UI Elements
        const authBtn = document.getElementById('auth-btn');
        const bannerAuthBtn = document.getElementById('banner-auth-btn');
        const adminBtn = document.getElementById('admin-btn');
        const loginNotice = document.getElementById('login-notice');
        const supportForm = document.getElementById('support-form');
        const userNameInput = document.getElementById('user-name');
        const userEmailInput = document.getElementById('user-email');
        const userMessageInput = document.getElementById('user-message');
        const submitBtn = document.getElementById('submit-btn');

        let currentUser = null;

        // Auth Logic
        const handleSignIn = () => {
            signInWithPopup(auth, provider).catch((error) => {
                alert("تعذر تسجيل الدخول: " + error.message);
            });
        };

        authBtn.addEventListener('click', () => {
            if (currentUser) {
                signOut(auth);
            } else {
                handleSignIn();
            }
        });

        bannerAuthBtn.addEventListener('click', handleSignIn);

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                authBtn.textContent = "تسجيل الخروج";
                loginNotice.classList.add('hidden');
                supportForm.classList.remove('hidden');

                userNameInput.value = user.displayName || "مستخدم";
                userEmailInput.value = user.email;

                if (user.email === ADMIN_EMAIL) {
                    adminBtn.classList.remove('hidden');
                } else {
                    adminBtn.classList.add('hidden');
                }
            } else {
                authBtn.textContent = "تسجيل الدخول بـ Google";
                loginNotice.classList.remove('hidden');
                supportForm.classList.add('hidden');
                adminBtn.classList.add('hidden');
            }
        });

        // Firestore Form Submit
        supportForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageText = userMessageInput.value.trim();
            if (!messageText) return;

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الإرسال...";

            try {
                await addDoc(collection(db, "messages"), {
                    senderName: currentUser.displayName,
                    senderEmail: currentUser.email,
                    message: messageText,
                    createdAt: serverTimestamp()
                });

                alert("تم إرسال طلبك بنجاح!");
                userMessageInput.value = "";
            } catch (error) {
                console.error("Error sending message: ", error);
                alert("حدث خطأ أثناء الإرسال: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "إرسال الطلب";
            }
        });
    </script>
</body>
</html>
