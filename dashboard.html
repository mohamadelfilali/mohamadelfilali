<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Mohammed El Filali</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #151c2c;
            --accent: #2563eb;
            --text-title: #ffffff;
            --text-body: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-title); min-height: 100vh; padding: 2rem; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .actions { display: flex; gap: 1rem; }
        .btn {
            background-color: var(--accent);
            color: #fff;
            padding: 0.65rem 1.25rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .btn-preview { background-color: #059669; }
        .btn-logout { background-color: #dc2626; }

        .messages-list { display: grid; gap: 1rem; }
        .msg-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 0.75rem;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-body);
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
        }

        .msg-sender { font-weight: 700; color: var(--text-title); }
        .msg-body { font-size: 1rem; line-height: 1.6; white-space: pre-wrap; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>لوحة تحكم المسؤول</h1>
        <div class="actions">
            <!-- زر المعاينة المزود بالرمز المخفي ?mode=preview لتفادي التحويل التلقائي -->
            <a href="index.html?mode=preview" class="btn btn-preview">👁️ معاينة الصفحة الرئيسية</a>
            <button id="logout-btn" class="btn btn-logout">تسجيل الخروج</button>
        </div>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 1rem;">الرسائل القادمة</h2>
        <div id="messages-container" class="messages-list">
            <p style="color: var(--text-body);">جاري تحميل الرسائل...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "mohamadelfilali",
            authDomain: "mohamadelfilali.firebaseapp.com",
            storageBucket: "mohamadelfilali.appspot.com"
        };

        const ADMIN_EMAIL = "rorminato@gmail.com";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // حماية لوحة التحكم: إذا لم يكن المطور، اطرد المستخدم للرئيسية
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== ADMIN_EMAIL) {
                window.location.href = "index.html";
            } else {
                loadMessages();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        function loadMessages() {
            const container = document.getElementById('messages-container');
            const q = query(collection(db, "messages"), orderBy("createdAt", "desc"));

            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    container.innerHTML = "<p style='color: var(--text-body);'>لا توجد رسائل حالياً.</p>";
                    return;
                }

                container.innerHTML = "";
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'msg-card';
                    card.innerHTML = `
                        <div class="msg-header">
                            <span class="msg-sender">${data.senderName} (${data.senderEmail})</span>
                        </div>
                        <div class="msg-body">${data.message}</div>
                    `;
                    container.appendChild(card);
                });
            });
        }
    </script>
</body>
</html>
