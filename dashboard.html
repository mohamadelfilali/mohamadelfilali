<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم | طلبات الرسائل</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
    body {
      background: #090d16;
      color: #fff;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      padding: 2rem;
    }
    h1 { margin-bottom: 1.5rem; color: #4facfe; }
    .msg-card {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1.2rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      color: #9ca3af;
      font-size: 0.9rem;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 0.5rem;
    }
    .msg-body { font-size: 1.05rem; line-height: 1.6; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h1>طلبات الرسائل الواردة</h1>
  <div id="messages-list">جاري تحميل الرسائل...</div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAmKRshA0eez-LDOPfd3gMErM4PHSbavvI",
      authDomain: "mohamadelfilali.firebaseapp.com",
      projectId: "mohamadelfilali",
      storageBucket: "mohamadelfilali.firebasestorage.app",
      messagingSenderId: "940757659354",
      appId: "1:940757659354:web:304d393c03d64617bfffe3",
      measurementId: "G-P5X5THHLEX"
    };

    const OWNER_EMAIL = "rorminato@gmail.com";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // حظر أي شخص غير المالك
    auth.onAuthStateChanged(user => {
      if (!user || user.email !== OWNER_EMAIL) {
        window.location.href = 'index.html';
      } else {
        loadMessages();
      }
    });

    // جلب الرسائل من قاعدة البيانات
    function loadMessages() {
      const listDiv = document.getElementById('messages-list');
      
      db.collection('messages').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
        listDiv.innerHTML = "";
        if (snapshot.empty) {
          listDiv.innerHTML = "<p>لا توجد رسائل حالياً.</p>";
          return;
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          const card = document.createElement('div');
          card.className = 'msg-card';
          card.innerHTML = `
            <div class="msg-header">
              <span><strong>المرسل:</strong> ${data.name} (${data.email})</span>
            </div>
            <div class="msg-body">${data.message}</div>
          `;
          listDiv.appendChild(card);
        });
      });
    }
  </script>
</body>
</html>
